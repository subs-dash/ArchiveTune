name: Build Debug APK (age-restricted playback fix)

# Minimal, secret-free debug build used to test the age-restricted /
# explicit-content playback fix in YTPlayerUtils.kt.
#
# - No signing secrets: the debug build type uses Gradle's auto-generated
#   debug keystore, and missing API keys fall back to empty strings.
# - Builds a single variant: gms + mobile + arm64 + Debug
#   -> Gradle task `assembleGmsMobileArm64Debug`.
# - Installs alongside the official app (applicationId suffix `.debug`).

on:
  workflow_dispatch:
  push:
    branches: [ 'fix/age-restricted-playback' ]
    paths-ignore:
      - 'README.md'
      - 'README_JA.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'

permissions:
  contents: write

jobs:
  build:
    name: Build Gms Mobile Arm64 Debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleGmsMobileArm64Debug
        env:
          PULL_REQUEST: 'false'
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "No APK produced" >&2
            find app/build/outputs/apk -type f || true
            exit 1
          fi
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: archivetune-gms-mobile-arm64-debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-age-fix-${{ github.run_number }}
          name: Debug build (age-restricted playback fix) #${{ github.run_number }}
          body: |
            Debug APK (gms / mobile / arm64) built to test the age-restricted /
            explicit-content playback fix in `YTPlayerUtils.kt`.

            Installs alongside the official app (applicationId suffix `.debug`).
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: true
